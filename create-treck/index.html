<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="./../assets/img/favicon.ico" />
    <meta name="theme-color" content="#19822c" />
    <meta name="description" content="Dirol dental care мятные вкусы с заботой о полости рта" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./../assets/css/styles.min.css" />
    <title>Создай трек</title>
  </head>
  <body class="body">
    <!--PRELOADER-->
    <div class="preloader"></div>

    <!--HEADER-->
    <header class="header" data-header>
      <a href="./../" class="go-back"><span>Назад</span></a>
      <a href="./../" class="logo"><img src="./../assets/img/svg/logo.svg" alt="Dirol logo" /></a>
      <a href="./../" class="logo"><img src="./../assets/img/svg/logo-music.svg" alt="Dirol logo" /></a>
    </header>

    <!--NAVIGATION-->
    <nav class="navigation">
      <ul class="menu">
        <li><a href="./../create-treck" class="menu__link">Сделать трек из фото</a></li>
        <li><a href="#" class="menu__link">Загрузить чек</a></li>
        <li><a href="./../lk" class="menu__link">Личный кабинет</a></li>
        <li><a href="#" class="menu__link">Об акции</a></li>
        <li><a href="./../prizes" class="menu__link">Призы</a></li>
        <li><a href="./../winners" class="menu__link">Победители</a></li>
        <li><a href="#" class="menu__link">Помощь</a></li>
      </ul>
    </nav>

    <!--BURGER BUTTON-->
    <button class="burger">
      <span>Меню бургер</span>
    </button>

    <!--MAIN-->
    <main class="main">
      <section class="section section--prizes">
        <h1 class="title">Создай трек</h1>
        <div class="container">
          <div class="create-track">
            <div class="description">
              <img src="./../assets/img/fruits/drums.webp" alt="drums" class="drums" />
              <p>Ты открыл мир музыки Dirol —<br />здесь у всего есть звук.<br />Загрузим фото и узнаем, как оно звучит? 🎧</p>
            </div>

            <!--ПРИМЕР ОБРАБОТКИ ФОРМЫ ЗАГРУЗКИ-->
            <script>
              const sendUploadedFile = e => {
                e.preventDefault();
                const form = e.target;
                const formData = new FormData(form);

                // Получаем загруженное фото из формы
                const photo = formData.get('photo');

                // Что-то с ним делаем и переходим на квиз (action="./../quiz")
                console.log(photo);
                window.location.href = form.action;
              };
            </script>

            <form action="./../quiz" class="form upload-form" data-state="empty" novalidate onsubmit="sendUploadedFile(event)">
              <!-- Скрытый input -->
              <input type="file" name="photo" id="upload-photo" hidden />

              <div class="upload-card">
                <div class="upload-preview"></div>
                <div class="upload-info">
                  <div class="upload-filename"></div>
                  <div class="upload-size"></div>
                  <div class="upload-message"></div>
                </div>
                <button type="button" class="delete-button" aria-label="Удалить фото"></button>
              </div>

              <label for="upload-photo" class="button full big">
                <span class="upload-button-text">ЗАГРУЗИТЬ ФОТО</span>
                <img src="./../assets/img/svg/upload.svg" alt="upload icon" />
              </label>

              <button type="submit" class="button big full"><span>Готово</span></button>
            </form>
          </div>

          <div class="headphone-and-mic">
            <img src="./../assets/img/fruits/headphones.webp" alt="headphones" class="headphones move-1" />
            <img src="./../assets/img/fruits/mic.webp" alt="microphone" class="microphone animatedIcon move-2" />
          </div>
        </div>
      </section>
    </main>

    <script src="./../assets/js/scripts.js" type="module"></script>
  </body>
</html>
