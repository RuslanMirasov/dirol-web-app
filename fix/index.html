<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="./../assets/img/favicon.ico" />
    <meta name="theme-color" content="#19822c" />
    <meta name="description" content="Dirol dental care мятные вкусы с заботой о полости рта" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./../assets/css/styles.min.css" />
    <title>Внести исправления в текущий трек</title>
  </head>
  <body class="body">
    <!--PRELOADER-->
    <div class="preloader"></div>

    <!--HEADER-->
    <header class="header" data-header>
      <a href="./../" class="go-back"><span>Назад</span></a>
      <a href="./../" class="logo"><img src="./../assets/img/svg/logo.svg" alt="Dirol logo" /></a>
      <a href="./../" class="logo"><img src="./../assets/img/svg/logo-music.svg" alt="Dirol logo" /></a>
    </header>

    <!--NAVIGATION-->
    <nav class="navigation">
      <ul class="menu">
        <li><a href="./../create-treck" class="menu__link">Сделать трек из фото</a></li>
        <li><a href="#" class="menu__link">Загрузить чек</a></li>
        <li><a href="./../lk" class="menu__link">Личный кабинет</a></li>
        <li><a href="#" class="menu__link">Об акции</a></li>
        <li><a href="./../prizes" class="menu__link">Призы</a></li>
        <li><a href="./../winners" class="menu__link">Победители</a></li>
        <li><a href="#" class="menu__link">Помощь</a></li>
      </ul>
    </nav>

    <!--BURGER BUTTON-->
    <button class="burger">
      <span>Меню бургер</span>
    </button>

    <!--MAIN-->
    <main class="main">
      <section class="section section--winners">
        <div class="container">
          <div class="description">
            <p>Выбери, какое уточнение <br />ты хочешь изменить</p>
          </div>

          <div class="fix">
            <form action="#" class="form" novalidate>
              <label class="label">
                <input type="radio" name="fix" value="Про кого твое фото" class="radio" onchange="window.location.href = './../quiz/?q=2'" />
                <span>Про кого твое фото</span>
              </label>

              <label class="label">
                <input type="radio" name="fix" value="Вайб снимка" class="radio" onchange="window.location.href = './../quiz/?q=3'" />
                <span>Вайб снимка</span>
              </label>

              <label class="label">
                <input type="radio" name="fix" value="Вкус Dirol" class="radio" onchange="window.location.href = './../quiz/?q=6'" />
                <span>Вкус Dirol</span>
              </label>

              <label class="label">
                <input type="radio" name="fix" value="Стиль трека" class="radio" onchange="window.location.href = './../quiz/?q=5'" />
                <span>Стиль трека</span>
              </label>

              <label class="label">
                <input type="radio" name="fix" value="Главное в твоей фотке" class="radio" onchange="window.location.href = './../quiz/?q=4'" />
                <span>Главное в твоей фотке</span>
              </label>
            </form>
          </div>
        </div>
      </section>
    </main>

    <script src="./../assets/js/scripts.js" type="module"></script>
  </body>
</html>
