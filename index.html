<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="./assets/img/favicon.ico" />
    <meta name="theme-color" content="#3ead5a" />
    <meta name="description" content="Dirol dental care мятные вкусы с заботой о полости рта" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/css/styles.min.css" />
    <title>Включи вкус Dirol</title>
  </head>
  <body class="body">
    <main class="main">
      <header class="header">header</header>
      <div class="container" style="margin: auto">
        <h1 style="margin: auto" onclick="window.quiz.set('imageVibe', 'Отличный вайб')">Start</h1>
        <h2 style="margin: auto" onclick="window.quiz.set('unique', true)">Уникальность</h2>
        <h2 style="margin: auto" onclick="window.quiz.reset()">Сброс</h2>
      </div>
      <form class="quiz-question">
        <h3>Какой вайб у снимка?</h3>

        <label class="quiz-option">
          <input type="radio" name="imageVibe" value="чилловый" onchange="window.quiz.set('imageVibe', this.value)" />
          Чилловый
        </label>

        <label class="quiz-option">
          <input type="radio" name="imageVibe" value="движовый" onchange="window.quiz.set('imageVibe', this.value)" />
          Движовый
        </label>

        <label class="quiz-option">
          <input type="radio" name="imageVibe" value="романтичный" onchange="window.quiz.set('imageVibe', this.value)" />
          Романтичный
        </label>

        <label class="quiz-option">
          <input type="radio" name="imageVibe" value="угарный" onchange="window.quiz.set('imageVibe', this.value)" />
          Угарный
        </label>

        <label class="quiz-option">
          <input type="radio" name="imageVibe" value="драматичный" onchange="window.quiz.set('imageVibe', this.value)" />
          Драматичный
        </label>

        <label class="quiz-option">
          <input type="radio" name="imageVibe" value="ми-ми-мишный" onchange="window.quiz.set('imageVibe', this.value)" />
          Ми-ми-мишный
        </label>

        <label class="quiz-option">
          <input type="radio" name="imageVibe" value="эстетик core" onchange="window.quiz.set('imageVibe', this.value)" />
          Эстетик core
        </label>
      </form>
    </main>

    <script src="./assets/js/scripts.js" type="module"></script>
  </body>
</html>
