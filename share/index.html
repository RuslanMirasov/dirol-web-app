<!doctype html>
<html lang="ru">
  <head>

    <link rel="stylesheet" href="./../assets/css/styles.min.css" />
    <title>Результат</title>
  </head>
  <body class="body">
    <!--PRELOADER-->
    <div class="preloader"></div>

    <!--HEADER-->
    <header class="header" data-header>
      <a href="./../" class="go-back"><span>Назад</span></a>
      <a href="./../" class="logo"><img src="./../assets/img/svg/logo.svg" alt="Dirol logo" /></a>
      <a href="./../" class="logo"><img src="./../assets/img/svg/logo-music.svg" alt="Dirol logo" /></a>
    </header>

    <!--NAVIGATION-->
    <nav class="navigation">

        <li><a href="./../create-treck" class="menu__link">Сделать трек из фото</a></li>
        <li><a href="#" class="menu__link">Загрузить чек</a></li>
        <li><a href="./../lk" class="menu__link">Личный кабинет</a></li>

    <main class="main">
      <section class="section section--result">
        <h1 class="title">Результат</h1>

        <div class="result-loading">
          <img src="./../assets/img/fruits/drums.webp" alt="drums" class="drums" />

            Отлично!<br />
            Теперь твои друзья тоже знают <br />

            А еще ты получишь <br />
            дополнительный шанс <br />
            на розыгрыш 100&nbsp;000&nbsp;рублей <br />
            при загрузке чека!
          </p>

          <div class="buttons">
            <a href="#" class="button"><span>зарегистрировать чек</span></a>
            <button
              class="button"
              onclick="
                window.quiz.reset();
                window.location.href = './../create-treck/';

            >
              <span>создать новый трек</span>
            </button>
          </div>
        </div>
